version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragnarbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragnarbot
      POSTGRES_PASSWORD: ragnarbot
      POSTGRES_DB: ragnarbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnarbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ragnarbot-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/ragnarbot
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4jdata:/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ragnarbot 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  neo4jdata:
